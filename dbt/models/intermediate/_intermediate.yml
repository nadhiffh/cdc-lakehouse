version: 2

models:
  - name: int_orders_current
    description: >
      Current state of each order, taken as the latest event per order_id.
      One row per order, so the fact table does not have to collapse the
      event log itself.
    columns:
      - name: order_id
        tests: [not_null, unique]
      - name: order_status
        tests: [not_null]
      - name: purchased_at
        tests: [not_null]
      - name: customer_unique_id
        tests: [not_null]
