version: 2

models:
  - name: stg_customer_events
    description: >
      Typed customer change events. event_seq orders them by (lsn,
      kafka_offset); business timestamps are not used for ordering.
    columns:
      - name: customer_unique_id
        tests: [not_null]
      - name: event_seq
        tests: [not_null]
      - name: city
        tests: [not_null]
      - name: state
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [customer_unique_id, event_seq]

  - name: stg_order_events
    description: Typed order change events, one row per Debezium event.
    columns:
      - name: order_id
        tests: [not_null]
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              values: [created, approved, invoiced, processing, shipped, delivered, unavailable, canceled]
      - name: purchased_at
        tests: [not_null]
      - name: event_seq
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [order_id, event_seq]

  - name: stg_order_items
    columns:
      - name: order_id
        tests: [not_null]
      - name: order_item_id
        tests: [not_null]
      - name: product_id
        tests: [not_null]
      - name: seller_id
        tests: [not_null]
      - name: price
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [order_id, order_item_id]

  - name: stg_products
    columns:
      - name: product_id
        tests: [not_null, unique]

  - name: stg_sellers
    columns:
      - name: seller_id
        tests: [not_null, unique]
